services:
  postgres:
    image: postgres:16-alpine
    container_name: docprocessing-postgres
    environment:
      POSTGRES_DB: docprocessing
      POSTGRES_USER: docprocessing
      POSTGRES_PASSWORD: docprocessing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docprocessing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docprocessing-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
