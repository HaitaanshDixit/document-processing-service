server:
  port: 8092

spring:
  application:
    name: document-processing-service
  datasource:
    url: jdbc:postgresql://localhost:5432/docprocessing
    username: docprocessing
    password: docprocessing
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  storage:
    upload-dir: ./uploads
  processing:
    max-attempts: 3
    backoff-initial-ms: 1000
    backoff-multiplier: 2.0
    backoff-max-ms: 10000
    worker-threads: 2
    lock-ttl-seconds: 30
    queue-poll-timeout-seconds: 5
    stale-processing-threshold-seconds: 120
    recovery-interval-ms: 60000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [documentId=%X{documentId}] - %msg%n"
  level:
    com.suretyseven.docprocessing: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
